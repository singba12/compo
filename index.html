<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion des Licences</title>
    <style>
        :root {
            --primary: #00853f;
            --danger: #e31b23;
            --bg: #f4f7f6;
            --white: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 10px; 
        }

        .header { padding: 10px 0; text-align: center; }

        /* Grille de stats responsive */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 25px; 
        }

        .stat-card { 
            background: var(--white); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            text-align: center;
        }

        .stat-card h3 { margin: 0; color: #666; font-size: 0.9rem; text-transform: uppercase; }
        .stat-card p { font-size: 1.5rem; font-weight: bold; margin: 10px 0 0; color: #333; }

        /* Conteneur principal */
        .admin-container { 
            background: var(--white); 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }

        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-gen { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            width: 100%; /* Mobile first */
        }

        @media (min-width: 600px) { .btn-gen { width: auto; } }

        /* Tableau responsive */
        .table-wrapper { overflow-x: auto; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 600px; /* Force le scroll horizontal sur petit écran */
        }

        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; color: #666; font-size: 0.85rem; }

        .status-badge { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: bold; 
        }
        .status-actif { background: #dcfce7; color: #166534; }
        .status-banni { background: #fee2e2; color: #991b1b; }

        .btn-action { 
            padding: 6px 12px; 
            border-radius: 6px; 
            border: 1px solid #ddd; 
            background: white; 
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Dashboard Licences 🇸🇳</h2>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Actifs</h3>
            <p id="count-actif">0</p>
        </div>
        <div class="stat-card">
            <h3>Bannis</h3>
            <p id="count-off">0</p>
        </div>
        <div class="stat-card">
            <h3>Ventes</h3>
            <p id="total-sales">0</p>
        </div>
        <div class="stat-card" style="border-bottom: 4px solid var(--primary);">
            <h3>Revenu Total</h3>
            <p id="total-revenue" style="color: var(--primary);">0 FCFA</p>
        </div>
    </div>

    <div class="admin-container">
        <div class="controls">
            <button class="btn-gen" onclick="genererNouveauCode()">+ Générer Code (1000 FCFA)</button>
            <span id="last-update" style="font-size: 0.8rem; color: #999;"></span>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Date</th>
                        <th>Appareil (HWID)</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // REMPLACER PAR VOTRE URL FIREBASE RÉELLE
        const FIREBASE_URL = "https://VOTRE-PROJET.firebaseio.com/licences.json";

        async function chargerDonnees() {
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                
                let html = "";
                let actif = 0, banni = 0, ventes = 0;

                if (data) {
                    for (let id in data) {
                        const item = data[id];
                        const isBanni = item.status === 'banni';
                        if(!isBanni) actif++; else banni++;
                        ventes++;

                        html += `
                            <tr>
                                <td><strong>${id}</strong></td>
                                <td>${item.date_creation}</td>
                                <td style="font-family: monospace; font-size: 0.8rem;">${item.hwid || 'Libre'}</td>
                                <td><span class="status-badge ${isBanni ? 'status-banni' : 'status-actif'}">${item.status}</span></td>
                                <td>
                                    <button class="btn-action" onclick="toggleStatut('${id}', '${item.status}')">
                                        ${isBanni ? 'Réactiver' : 'Bannir'}
                                    </button>
                                </td>
                            </tr>
                        `;
                    }
                }

                document.getElementById('table-body').innerHTML = html || "<tr><td colspan='5' style='text-align:center'>Aucun code généré</td></tr>";
                document.getElementById('count-actif').innerText = actif;
                document.getElementById('count-off').innerText = banni;
                document.getElementById('total-sales').innerText = ventes;
                document.getElementById('total-revenue').innerText = (ventes * 1000).toLocaleString() + " FCFA";
                document.getElementById('last-update').innerText = "MàJ : " + new Date().toLocaleTimeString();
            } catch (e) {
                console.error("Erreur Firebase : ", e);
            }
        }

        async function genererNouveauCode() {
            const prefix = "COMPO-";
            const randomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            const nouveauCode = prefix + randomId;
            
            const payload = {
                status: "actif",
                hwid: "",
                date_creation: new Date().toLocaleDateString('fr-FR')
            };

            await fetch(`https://VOTRE-PROJET.firebaseio.com/licences/${nouveauCode}.json`, {
                method: 'PUT',
                body: JSON.stringify(payload)
            });

            chargerDonnees();
        }

        async function toggleStatut(id, actuel) {
            const nouveauStatut = actuel === 'actif' ? 'banni' : 'actif';
            if(!confirm(`Passer le code ${id} en ${nouveauStatut} ?`)) return;

            await fetch(`https://VOTRE-PROJET.firebaseio.com/licences/${id}/status.json`, {
                method: 'PUT',
                body: JSON.stringify(nouveauStatut)
            });
            chargerDonnees();
        }

        // Rafraîchir toutes les 30 secondes
        setInterval(chargerDonnees, 30000);
        window.onload = chargerDonnees;
    </script>
</body>
</html>
